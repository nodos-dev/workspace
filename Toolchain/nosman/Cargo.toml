[package]
name = "nosman"
version = "0.16.1"
edition = "2021"
description = "Nodos Package/Module Manager: a command-line tool to install, upgrade, configure, and remove modules from a Nodos system."
license = "MIT"
repository = "https://github.com/nodos-dev/workspace"
homepage = "https://nodos.dev"
readme = "README.md"
keywords = ["nodos", "package-manager", "cli", "module", "package"]
categories = ["command-line-utilities", "development-tools"]
# data/cmake-toolchain is gitignored (vendored by build.rs); `include` ships it.
include = ["src/**/*", "data/**/*", "examples/**/*", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[profile.release]
opt-level = 'z'     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic
strip = false       # Strip symbols from binary*

[profile.relwithdebinfo]
inherits = "release"
debug = true

[dependencies]
clap = { version = "4.5.20", features = ["string"] }
indicatif = "0.18.3"
tempfile = "3.10.1"
serde = { version = "1.0.201", features = ["derive"] }
serde_json = "1.0.117"
zip = "6.0.0"
colored = "3.0.0"
include_dir = "0.7.3"
dunce = "1.0.4"
pathdiff = "0.2.1"
globwalk = "0.9.1"
libloading = "0.9.0"
self-replace = "1.3.7"
bitflags = "2.5.0"
rm_rf = "0.6.2"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }
native-dialog = "0.9.4"
fs-more = "0.8.1"
filetime = "0.2.23"
linked_hash_set = "0.1.4"
phf = { version = "0.13.1", features = ["macros"] }
chrono = "0.4.38"
inquire = "0.9.1"
rayon = "1.10.0"
hostname = "0.4.0"
thiserror = "2.0.9"
wait-timeout = "0.2"
nodos-store-client = "0.8.2"

[dev-dependencies]
log = "0.4.21"
env_logger = "0.11.3"
ctor = "0.6.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["libloaderapi", "winuser", "wincon", "processenv", "winbase", "fileapi", "handleapi", "minwinbase", "winnt"] }

[target.'cfg(unix)'.dependencies]
flate2 = "1.0.34"
tar = "0.4.42"

[build-dependencies]
vergen = { version = "7.5.1", default-features = false, features = ["build"]}
anyhow = "1.0.83"
