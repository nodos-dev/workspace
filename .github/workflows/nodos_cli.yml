# This is a basic workflow to help you get started with Actions

name: Nodos CLI

# Controls when the workflow will run
on:
  push:
    branches:
      - "dev"        # Specific branch
      - "[0-9]+.[0-9]+" # Version branches
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      clean:
        type: boolean
        description: 'Clean build'
        required: true
      sign:
        type: boolean
        description: 'Sign binaries'
        required: true
      linux:
        description: 'Run for Linux'
        required: true
        default: true
        type: boolean
      windows:
        description: 'Run for Windows'
        required: true
        default: true
        type: boolean
      linux_arm:
        description: 'Cross-compile for Linux ARM (aarch64)'
        required: false
        default: true
        type: boolean
      publish_mode:
        description: 'Publish Mode'
        required: true
        default: 'None'
        type: choice
        options:
          - Publish
          - None
env:
  BUILD_NUMBER: ${{ github.run_number }}
  GH_USERNAME: "nodos-bot"
  GIT_EMAIL: "bot@nodos.dev"

# TODO: Support parallel runs
concurrency:
  group: ${{ github.ref_name }} # For now, allow 1 run at a time for each branch
  cancel-in-progress: false # Queue up runs if one is already in progress.

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  prepare-strategy:
    name: Prepare Strategy
    runs-on: self-hosted
    outputs:
      build-matrix: ${{ steps.prepare-step.outputs.build-matrix }}
    steps:
      - name: Prepare Build Matrix
        id: prepare-step
        shell: bash
        run: |
          runner_list=$(python3 -c "$(wget -q -O - https://raw.githubusercontent.com/nodos-dev/actions/refs/heads/main/scripts/prep_runner_list.py)" \
            --workflow-input-linux ${{ inputs.linux }} \
            --workflow-input-windows ${{ inputs.windows }} \
            --sign ${{ inputs.sign }} \
            --ref-name ${{ github.ref_name }} \
            --event-name ${{ github.event_name }} \
            --push-event-defaults '{"linux": true, "windows": true, "sign": false}')
          echo Runners: $runner_list

          # Build matrix entries: [{runner: [...], rust_target: ""}] for native,
          # plus [{runner: <linux-runner>, rust_target: "aarch64-unknown-linux-gnu"}] for cross.
          build_matrix=$(python3 -c "
          import json, sys
          runners = $runner_list
          linux_arm_input = '${{ inputs.linux_arm }}'.lower()
          linux_arm = linux_arm_input == 'true' or linux_arm_input == ''
          matrix = []
          linux_runner = None
          for r in runners:
              matrix.append({'runner': r, 'rust_target': ''})
              if r[0] == 'Linux':
                  linux_runner = r
          if linux_arm and linux_runner:
              matrix.append({'runner': linux_runner, 'rust_target': 'aarch64-unknown-linux-gnu'})
          print(json.dumps(matrix))
          ")
          echo "Build matrix: $build_matrix"
          echo "build-matrix=$build_matrix" >> $GITHUB_OUTPUT

  build_nosman:
    strategy:
      matrix:
        entry: ${{ fromJson(needs.prepare-strategy.outputs.build-matrix) }}
      fail-fast: false
    outputs:
      version: ${{ steps.get.outputs.version }}
    name: "Nodos CLI: ${{ github.ref_name }} - ${{ github.run_number }} (${{ matrix.entry.runner[0] }}${{ matrix.entry.rust_target != '' && format(', {0}', matrix.entry.rust_target) || '' }})"
    runs-on: ${{ matrix.entry.runner }}
    needs: prepare-strategy
    steps:
      - name: Update Git Credentials
        shell: bash
        run: |
            if [ "${{ matrix.entry.runner[0] }}" == "Linux" ]; then
              export GPG_TTY=$(tty)
            fi
            git credential-manager github login --username ${{ env.GH_USERNAME }} --token ${{ secrets.CI_TOKEN }} --force

      - name: Clean Build
        shell: pwsh
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.clean == 'true' }}
        run: |
            if (Test-Path -Path ./nodos-cli-${{ github.ref_name }}) { Remove-Item -Path ./nodos-cli-${{ github.ref_name }} -Recurse -Force }

      - name: Checkout Nodos Workspace
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "./nodos-cli-${{ github.ref_name }}" ]; then
            git clone --depth 1 "https://github.com/${{ github.repository }}.git" --recurse-submodules --shallow-submodules "./nodos-cli-${{ github.ref_name }}"
          fi
          cd "./nodos-cli-${{ github.ref_name }}"
          git fetch origin
          git fetch --tags --force
          git clean -ffd
          git checkout ${{ github.sha }}
          git reset --hard
          git submodule update --init --recursive --depth 1
          git status

      - name: Setup Cross-Compilation Toolchain
        if: ${{ matrix.entry.rust_target != '' }}
        shell: bash
        run: |
          if ! command -v aarch64-linux-gnu-gcc &> /dev/null; then
            echo "::error::aarch64-linux-gnu-gcc is not installed. Please install it on the runner: sudo apt-get install gcc-aarch64-linux-gnu"
            exit 1
          fi
          aarch64-linux-gnu-gcc --version
          rustup target add ${{ matrix.entry.rust_target }}

      - name: Build Nodos CLI
        shell: pwsh
        run: |
            $target = "${{ matrix.entry.rust_target }}"
            if ($target -ne "") {
                $env:CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "aarch64-linux-gnu-gcc"
                $env:CC_aarch64_unknown_linux_gnu = "aarch64-linux-gnu-gcc"
                cargo build --release --target $target
            } else {
                cargo build --release
            }
        working-directory: ./nodos-cli-${{ github.ref_name }}/Toolchain/nosman

      - name: Install cargo-nextest
        if: ${{ matrix.entry.rust_target == '' }}
        shell: bash
        run: cargo nextest --version 2>/dev/null || cargo install cargo-nextest --locked

      - name: Run Regression Tests
        if: ${{ matrix.entry.rust_target == '' }}
        shell: pwsh
        run: |
            cargo nextest run --release --no-fail-fast
        working-directory: ./nodos-cli-${{ github.ref_name }}/Toolchain/nosman

      - name: Get Version & File Names
        shell: bash
        id: get
        run: |
          set -e
          rust_target="${{ matrix.entry.rust_target }}"
          if [[ -n "$rust_target" ]]; then
            release_dir="./nodos-cli-${{ github.ref_name }}/Toolchain/nosman/target/$rust_target/release"
          else
            release_dir="./nodos-cli-${{ github.ref_name }}/Toolchain/nosman/target/release"
          fi

          file="nosman"
          if [[ "${{ matrix.entry.runner[0] }}" == "Windows" ]]; then
            platform="windows"
            platform_exe_suffix=".exe"
            arch=$(pwsh -Command "Write-Output \$env:PROCESSOR_ARCHITECTURE" | tr '[:upper:]' '[:lower:]')
            if [[ "$arch" == "amd64" || "$arch" == "x86_64" ]]; then
              arch="x86_64"
            elif [[ "$arch" == "arm64" ]]; then
              arch="aarch64"
            fi
          else
            platform="linux"
            platform_exe_suffix=""
            if [[ "$rust_target" == *"aarch64"* ]]; then
              arch="aarch64"
            else
              arch=$(uname -m)
            fi
          fi

          renamed_file="nosman-$platform-$arch$platform_exe_suffix"
          original_file="$file$platform_exe_suffix"

          cp -f "$release_dir/$original_file" "$release_dir/$renamed_file"

          version=$(grep '^version' ./nodos-cli-${{ github.ref_name }}/Toolchain/nosman/Cargo.toml | head -1 | sed -nE 's/.*"([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p')
          echo "Version: $version"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "file_to_release=$renamed_file" >> $GITHUB_OUTPUT
          echo "release_dir=$release_dir" >> $GITHUB_OUTPUT

      - name: Sign Binaries
        if: ${{ inputs.publish_mode == 'Publish' && matrix.entry.runner[0] == 'Windows' && inputs.sign == 'true' }}
        run: |
          cd $MEDIAZ_SCRIPTS_DIR
          python sign_module.py "${{ github.workspace }}/${{ steps.get.outputs.release_dir }}"
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get.outputs.file_to_release }}
          path: ${{ steps.get.outputs.release_dir }}/${{ steps.get.outputs.file_to_release }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build_nosman
    if: ${{ inputs.publish_mode == 'Publish' }}
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Create or Update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
      
          VERSION="v${{ needs.build_nosman.outputs.version }}"
          REPO="nodos-dev/workspace"

          shopt -s globstar nullglob
          FILES=()
          for f in ./release-artifacts/**; do
            [ -f "$f" ] && FILES+=("$f")
          done

          if ! gh release view "$VERSION" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$VERSION" "${FILES[@]}" \
              --repo "$REPO" \
              --title "Release $VERSION" \
              --generate-notes
          else
            gh release upload "$VERSION" "${FILES[@]}" \
              --repo "$REPO" \
              --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
